name: Payout frontend TypeScript and Next.js QA

on:
  push:
    branches: [feat/disbursement-payout-ux]
  pull_request:
    branches: [feat/rn06-member-voting-ui]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types
        run: npm run lint
      - name: Build Next.js
        run: npm run build
