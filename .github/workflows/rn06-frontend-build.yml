name: RN06 frontend validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (repository has no lockfile)
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build Next.js
        run: npm run build
